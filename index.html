 if(reason==='company'){
   const i=data.rankings.findIndex(r=>r.id===state.company),target=40+i*66+33,box=$('rank-chart');
   if(target<box.scrollLeft+30||target>box.scrollLeft+box.clientWidth-30)box.scrollLeft=Math.max(0,target-box.clientWidth/2);
 }
 const query=new URLSearchParams({month:state.month,role:state.role,...(state.company?{company:state.company}:{}),...(state.query?{query:state.query}:{})});query.set('tab','partners');history.replaceState(null,'','?'+query);
 if(openedPartnerMediaKey){const target=[...$('media-chart').querySelectorAll('[data-media]')].find(el=>el.dataset.media===openedPartnerMediaKey);if(target)openPartnerMedia(openedPartnerMediaKey,target);else closePartnerMedia();}
}
async function load(reason='poll'){
 if(reason!=='poll'){closeNote();closePartnerMedia();}
 const n=++serial;if(controller)controller.abort();controller=new AbortController();clearTimeout(timer);
 if(!views[mode]||reason!=='poll')$('app').setAttribute('aria-busy','true');$('refresh').disabled=true;
 try{
  const res=await fetch('https://luux-partner-dashboard.yj-seo-5589.chatgpt.site'+(mode==='partners'?'/api/dashboard':mode==='search'?'/api/search':'/api/media')+'?'+new URLSearchParams(mode==='partners'?state:extraState[mode]),{cache:'no-store',signal:controller.signal});const data=await res.json();if(!res.ok)throw Error(data.error||'데이터 조회 실패');if(n!==serial)return;
  views[mode]=data;if(mode==='partners')render(data,reason);else renderExtra(data,reason);failed=false;$('error').hidden=true;
 }catch(e){if(e.name==='AbortError')return;failed=true;$('error').textContent=(views[mode]?'자동 갱신 실패 · 이전 데이터를 표시 중입니다. ':'')+e.message;$('error').hidden=false;if(!views[mode]){$('updated').textContent='연결 확인 필요';$('rank').querySelector('tbody').innerHTML='<tr><td colspan="3" class="empty">데이터를 불러오지 못했습니다.</td></tr>';}}
 finally{if(n===serial){$('app').setAttribute('aria-busy','false');$('refresh').disabled=false;timer=setTimeout(()=>{if(!document.hidden)load('poll');else timer=setTimeout(()=>load('poll'),30000);},30000);}}
}
function choose(id){if(id===state.company)return;state.company=id;load('company');}
$('rank').addEventListener('click',e=>{const target=e.target.closest('[data-company]');if(target)choose(target.dataset.company);});
$('rank-chart').addEventListener('click',e=>{const target=e.target.closest('[data-company]');if(target)choose(target.dataset.company);});
$('rank-chart').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const target=e.target.closest('[data-company]');if(target){e.preventDefault();choose(target.dataset.company);}}});
$('month').addEventListener('change',()=>{state.month=$('month').value;load('filter');});$('role').addEventListener('change',()=>{state.role=$('role').value;updatePartnerSearchLabel();state.company='';load('filter');});let partnerSearchDelay;function searchPartner(){state.query=$('company').value.trim();state.company='';load('filter');}$('company').addEventListener('input',()=>{clearTimeout(partnerSearchDelay);partnerSearchDelay=setTimeout(searchPartner,350);});$('company').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(partnerSearchDelay);searchPartner();}});$('refresh').addEventListener('click',()=>load('poll'));
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(views[mode]){if(mode==='partners')render(views[mode],'poll');else renderExtra(views[mode],'poll');}},160);});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load('poll');});

function setUpdated(data){$('updated').textContent=timestamp(data.syncedAtISO);$('updated').title='입력 시트 직접 읽기 · 최근 연결 확인 '+new Date(data.checkedAtISO).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour12:false})+' KST · 30초마다 자동 확인';}
const mediaLabels={'룩스':'룩스','K비전':'K비전','루미':'루미미디어','KT':'KT스퀘어','신세계':'신세계스퀘어','매경':'매경엠시티','KPOP':'K-POP라이브미디어'};
const labelMedia=m=>mediaLabels[m]||m;
function renderExtra(data,reason){
 setUpdated(data);const st=extraState[mode];
 if(mode==='search'){
  const box=document.querySelector('.search-table-wrap'),top=box.scrollTop,left=box.scrollLeft;
  options($('search-month'),data.months.map(v=>({value:v,label:v})),st.month);options($('search-media'),data.mediaOptions.map(v=>({value:v,label:labelMedia(v)})),st.media);
  if(document.activeElement!==$('search-company'))$('search-company').value=st.company==='전체'?'':st.company;
  $('search-head').innerHTML=data.headers.map(h=>'<th>'+esc(h)+'</th>').join('');
  $('search-body').innerHTML=data.rows.length?data.rows.map(row=>'<tr>'+row.map((v,i)=>'<td>'+esc(/누적기간/.test(data.headers[i]||'')?formatWeeks(v):v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="9" class="empty">'+esc(data.message||'조회 결과가 없습니다.')+'</td></tr>';
  box.scrollTop=reason==='poll'?top:0;box.scrollLeft=left;
 }else{
  st.month=data.month;st.media=data.selectedMedia;
  options($('media-month'),data.months.map(v=>({value:v,label:v})),data.month);options($('media-select'),data.mediaOptions.map(v=>({value:v,label:labelMedia(v)})),data.selectedMedia);
  $('media-summary-body').innerHTML=data.summary.map(r=>'<tr class="'+(r.media===data.selectedMedia?'selected':'')+'"><td><button class="company" data-media="'+esc(r.media)+'">'+esc(labelMedia(r.media))+'</button></td><td>'+(r.count==null?'—':r.count)+'</td><td>'+delta(r.delta)+'</td><td>'+(r.exclusiveCount==null?'—':r.exclusiveCount)+'</td><td>'+(r.exclusiveRatio==null?'—':(r.exclusiveRatio*100).toFixed(1)+'%')+'</td></tr>').join('');
  document.querySelectorAll('.weeks-heading').forEach(el=>el.textContent=data.month==='전체'?'누적기간':'월 집행');
  const box=document.querySelector('.media-detail-scroll'),top=box.scrollTop;let html='';
  for(let i=0;i<Math.max(data.exclusive.length,data.common.length);i++){
    const a=data.exclusive[i],b=data.common[i];html+='<tr><td'+(a?.short?' class="short"':'')+'>'+esc(a?.name||'')+'</td><td'+(a?.short?' class="short"':'')+'>'+esc(a?.weeks||'')+'</td><td'+(b?.short?' class="short"':'')+'>'+(b?'<button type="button" class="note-name" aria-haspopup="dialog" aria-expanded="false" data-note-key="'+esc(b.key)+'" data-note="'+esc(b.notes)+'" data-name="'+esc(b.name)+'">'+esc(b.name)+'</button>':'')+'</td><td'+(b?.short?' class="short"':'')+'>'+esc(b?.weeks||'')+'</td></tr>';
  }
  $('media-details-body').innerHTML=html||'<tr><td colspan="4" class="empty">해당 조건의 광고주가 없습니다.</td></tr>';box.scrollTop=reason==='poll'?top:0;
  if(openedNoteKey){const target=[...document.querySelectorAll('[data-note-key]')].find(b=>b.dataset.noteKey===openedNoteKey);if(target)openNote(target);else closeNote();}
  const left=$('monthly-chart').scrollLeft;
  chart('monthly-chart',data.summary.map(r=>({id:r.media,name:labelMedia(r.media),value:r.count})),data.selectedMedia,false,true);$('monthly-chart').scrollLeft=reason==='filter'?0:left;
 }
 const query=new URLSearchParams({tab:mode,...st});history.replaceState(null,'','?'+query);
}
function showMode(next){
 mode=next;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===mode);b.setAttribute('aria-pressed',String(b.dataset.tab===mode));});
 $('app').hidden=mode!=='partners';$('search-page').hidden=mode!=='search';$('media-page').hidden=mode!=='media';$('partner-filters').hidden=mode!=='partners';$('search-filters').hidden=mode!=='search';$('media-filters').hidden=mode!=='media';
 document.querySelector('h1').textContent=mode==='search'?'집행 내역 검색':mode==='media'?'2026 매체별 광고주 현황':'2026 대행사·렙사별 광고주 현황';
 document.title=document.querySelector('h1').textContent+' · 경쟁매체 보고';$('error').hidden=true;load('tab');
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)showMode(b.dataset.tab);});
for(const [id,key] of [['search-month','month'],['search-media','media']])$(id).addEventListener('change',()=>{extraState.search[key]=$(id).value;load('filter');});
let searchDelay;$('search-company').addEventListener('input',()=>{clearTimeout(searchDelay);searchDelay=setTimeout(()=>{extraState.search.company=$('search-company').value.trim()||'전체';load('filter');},350);});
$('search-company').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(searchDelay);extraState.search.company=$('search-company').value.trim()||'전체';load('filter');}});
for(const [id,key] of [['media-month','month'],['media-select','media']])$(id).addEventListener('change',()=>{extraState.media[key]=$(id).value;load('filter');});
function selectMedia(e){const b=e.target.closest('[data-media]');if(b){extraState.media.media=b.dataset.media;load('company');}}
$('media-summary-body').addEventListener('click',selectMedia);$('monthly-chart').addEventListener('click',selectMedia);$('monthly-chart').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectMedia(e);}});


let openedNoteKey='';
function notePosition(rect,width,height,viewportWidth,viewportHeight){
 const left=rect.right+12+width<=viewportWidth-12?rect.right+12:Math.max(12,Math.min(rect.left,viewportWidth-width-12));
 const top=Math.max(12,Math.min(rect.top,viewportHeight-height-12));return {left,top};
}
function closeNote(){
 openedNoteKey='';$('execution-note').hidden=true;document.querySelectorAll('[data-note-key][aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
}
function executionNoteHTML(note){
 return String(note||'').split('\n').filter(Boolean).map(line=>{
   const colon=line.indexOf(':'),region=colon<0?'':line.slice(0,colon),content=colon<0?line:line.slice(colon+1).trim();
   const media=content.split(',').map(item=>{const match=item.trim().match(/^(.*?)\(([^()]*)\)$/);return '<span class="placement">'+(match?esc(match[1].trim())+'('+esc(match[2])+')':esc(item.trim()))+'</span>';}).join(' ');
   return '<div class="media-note-row">'+(region?'<span class="meta-label">'+esc(region)+':</span>':'')+'<div class="placements">'+media+'</div></div>';
 }).join('');
}
function openNote(button){
 closeNote();openedNoteKey=button.dataset.noteKey;
 $('note-advertiser').textContent=button.dataset.name;$('note-content').innerHTML=executionNoteHTML(button.dataset.note||'광화문 권역: -\n강남 권역: -\n명동 권역: -');
 button.setAttribute('aria-expanded','true');const popup=$('execution-note');popup.hidden=false;
 const rect=button.getBoundingClientRect(),position=notePosition(rect,popup.offsetWidth,popup.offsetHeight,innerWidth,innerHeight);
 popup.style.left=position.left+'px';popup.style.top=position.top+'px';
}
$('media-details-body').addEventListener('click',e=>{const button=e.target.closest('[data-note-key]');if(!button)return;const same=openedNoteKey===button.dataset.noteKey;if(same)closeNote();else openNote(button);});
$('execution-note').querySelector('.note-close').addEventListener('click',closeNote);
document.addEventListener('click',e=>{if(!e.target.closest('[data-note-key]')&&!e.target.closest('#execution-note'))closeNote();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openedNoteKey){const button=[...document.querySelectorAll('[data-note-key]')].find(b=>b.dataset.noteKey===openedNoteKey);closeNote();button?.focus();}});
document.querySelector('.media-detail-scroll').addEventListener('scroll',closeNote,{passive:true});
window.addEventListener('scroll',closeNote,{passive:true});window.addEventListener('resize',closeNote);


let openedPartnerMediaKey='';
function partnerMediaRows(details,medium){
 return details.map((d,index)=>{const period=d.media.find(m=>m.media===medium);return period?{name:d.name,counterparts:d.counterpartNames,period:typeof period.value==='number'&&period.value>0?period.value:null,index}:null;}).filter(Boolean).sort((a,b)=>(b.period??-1)-(a.period??-1)||a.index-b.index);
}
function closePartnerMedia(){openedPartnerMediaKey='';$('partner-media-note').hidden=true;}
function openPartnerMedia(medium,target){
 if(!view)return;openedPartnerMediaKey=medium;const popup=$('partner-media-note'),rows=partnerMediaRows(view.details,medium),counterpart=view.role==='렙사'?'대행사':'렙사';
 $('partner-media-title').textContent=labelMedia(medium);
 $('partner-media-rows').innerHTML=rows.length?rows.map(r=>'<div class="media-note-row"><span class="meta-label">광고주: </span><strong>'+esc(r.name)+'</strong> ('+(r.period===null?'—':r.period+'주')+') <span class="meta-label"> / '+counterpart+': </span><strong>'+esc(r.counterparts.join(', ')||'—')+'</strong></div>').join(''):'<div class="empty">해당 매체의 광고주가 없습니다.</div>';
 popup.hidden=false;const rect=target.getBoundingClientRect(),position=notePosition(rect,popup.offsetWidth,popup.offsetHeight,innerWidth,innerHeight);popup.style.left=position.left+'px';popup.style.top=position.top+'px';
}
function partnerMediaClick(e){const target=e.target.closest('[data-media]');if(target)openPartnerMedia(target.dataset.media,target);}
$('media-chart').addEventListener('click',partnerMediaClick);$('media-chart').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();partnerMediaClick(e);}});
$('partner-media-note').querySelector('.note-close').addEventListener('click',closePartnerMedia);
document.addEventListener('click',e=>{if(!e.target.closest('#media-chart')&&!e.target.closest('#partner-media-note'))closePartnerMedia();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePartnerMedia();});window.addEventListener('resize',closePartnerMedia);window.addEventListener('scroll',closePartnerMedia,{passive:true});

showMode(mode);
})();
</script></body></html>
